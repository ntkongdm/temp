name: Python Unit Tests

on:
  pull_request:
    branches: [ main, master, develop, demo/* ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/unit_test_python.yml'
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-json-report pytest-cov
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt || true
        fi
    
    - name: 🧪 Run tests with coverage
      id: pytest
      continue-on-error: true
      run: |
        pytest tests/ \
          --json-report \
          --json-report-file=test-results.json \
          --cov=. \
          --cov-report=term \
          --cov-report=json:coverage.json \
          -v > test-output.txt 2>&1
        echo "exit_code=$?" >> $GITHUB_OUTPUT
    
    - name: 📊 Parse test results
      id: parse_results
      run: |
        # Parse JSON report
        if [ -f test-results.json ]; then
          TOTAL=$(jq -r '.summary.total // 0' test-results.json)
          PASSED=$(jq -r '.summary.passed // 0' test-results.json)
          FAILED=$(jq -r '.summary.failed // 0' test-results.json)
          SKIPPED=$(jq -r '.summary.skipped // 0' test-results.json)
          ERRORS=$(jq -r '(.summary.error // 0)' test-results.json)
          DURATION=$(jq -r '.duration // 0' test-results.json)
          
          # Calculate pass rate
          if [ "$TOTAL" -gt 0 ]; then
            PASS_RATE=$(echo "scale=2; ($PASSED / $TOTAL) * 100" | bc)
          else
            PASS_RATE=0
          fi
          
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
          
          # Check if pass rate meets threshold (80%)
          if (( $(echo "$PASS_RATE >= 80" | bc -l) )); then
            echo "meets_threshold=true" >> $GITHUB_OUTPUT
          else
            echo "meets_threshold=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "total=0" >> $GITHUB_OUTPUT
          echo "passed=0" >> $GITHUB_OUTPUT
          echo "failed=0" >> $GITHUB_OUTPUT
          echo "skipped=0" >> $GITHUB_OUTPUT
          echo "errors=0" >> $GITHUB_OUTPUT
          echo "duration=0" >> $GITHUB_OUTPUT
          echo "pass_rate=0" >> $GITHUB_OUTPUT
          echo "meets_threshold=false" >> $GITHUB_OUTPUT
        fi
    
    - name: 📝 Generate test details
      id: test_details
      if: always()
      run: |
        # Generate detailed test table from JSON
        if [ -f test-results.json ]; then
          python3 << 'PYTHON_EOF' > test-details.md
        import json
        import sys
        
        try:
            with open('test-results.json', 'r') as f:
                data = json.load(f)
            
            tests = data.get('tests', [])
            
            if tests:
                print("| Test Name | Status | Duration |")
                print("|-----------|--------|----------|")
                
                for test in tests:
                    name = test.get('nodeid', 'Unknown')
                    outcome = test.get('outcome', 'unknown')
                    duration = test.get('call', {}).get('duration', 0)
                    
                    # Format outcome with emoji
                    if outcome == 'passed':
                        status = '✅ Passed'
                    elif outcome == 'failed':
                        status = '❌ Failed'
                    elif outcome == 'skipped':
                        status = '⏭️ Skipped'
                    else:
                        status = f'⚠️ {outcome}'
                    
                    print(f"| `{name}` | {status} | {duration:.3f}s |")
            else:
                print("_No test details available_")
                
        except Exception as e:
            print(f"_Error parsing test results: {e}_")
            sys.exit(0)
        PYTHON_EOF
        else
          echo "_No test results found_" > test-details.md
        fi
        
        # Read the generated content
        TEST_DETAILS=$(cat test-details.md)
        
        # Save to output using multiline
        echo "test_table<<EOF" >> $GITHUB_OUTPUT
        echo "$TEST_DETAILS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: 📋 Post PR Comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const script = require('./.github/scripts/unittest-comment.js');
          await script({ github, context, core });
    
    - name: 📤 Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test-results.json
          test-output.txt
          coverage.json
          test-details.md
        retention-days: 30
    
    - name: ✅ Check threshold
      if: steps.parse_results.outputs.meets_threshold != 'true'
      run: |
        echo "::error::Test pass rate (${{ steps.parse_results.outputs.pass_rate }}%) is below the required threshold of 80%"
        exit 1
    
    - name: 🎉 Success
      if: steps.parse_results.outputs.meets_threshold == 'true'
      run: |
        echo "::notice::All tests passed! Pass rate: ${{ steps.parse_results.outputs.pass_rate }}%"

