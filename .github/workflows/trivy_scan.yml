      #     # Gửi request đến HTTP URL
      #     curl -X POST "https://workflow.openledger.vn/webhook-test/c813b972-8fd3-4fc6-9d13-9c8c905cf0b6" \
      #       -H "Content-Type: application/json" \
      #       -d "$PAYLOAD" || echo "Failed to send results to webhook"

      - name: Fail if critical vulnerabilities found
        if: always()
        run: |
          CRITICAL_COUNT=$(cat trivy-results.txt | grep -c "CRITICAL" || true)
          if [ $CRITICAL_COUNT -gt 0 ]; then
            echo "::error::❌ Found $CRITICAL_COUNT CRITICAL vulnerabilities!"
            exit 1
          fi
