  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest # hoặc ubuntu-latest nếu ko dùng self-hosted runner
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Trivy cache
        run: |
          rm -rf .cache/trivy
          rm -rf ~/.cache/trivy

      - name: Run Trivy scan (JSON format)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          ignore-unfixed: true
          format: json
          scan-ref: "."
          output: trivy-results.json
          severity: CRITICAL,HIGH
          skip-dirs: .cache/**,trivy
          skip-files: Manifest.toml,Project.toml

      - name: Run Trivy scan (Table format)
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          scan-type: fs
          scanners: vuln,misconfig
          ignore-unfixed: true
          format: table
          scan-ref: "."
          output: trivy-results.txt
          severity: CRITICAL,HIGH
          skip-dirs: .cache/**,trivy
          skip-files: Manifest.toml,Project.toml

      - name: Generate and post comment
        uses: actions/github-script@v7
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const processTrivy = require('./.github/scripts/trivy-comment.js');
            const result = await processTrivy({ github, context });

            console.log('📊 Scan Summary:');
            console.log(`   Total: ${result.vulnCount}`);
            console.log(`   Critical: ${result.criticalCount}`);
            console.log(`   High: ${result.highCount}`);

            // Set output cho các step sau
            core.setOutput('vuln_count', result.vulnCount);
            core.setOutput('critical_count', result.criticalCount);

      # - name: Send results to HTTP endpoint
      #   if: always()
      #   run: |
