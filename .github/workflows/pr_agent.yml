  #         github_action_config.auto_improve: "true"

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Trivy cache
        run: |
          rm -rf .cache/trivy
          rm -rf ~/.cache/trivy

      - name: Run Trivy scan (JSON format)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          ignore-unfixed: true
          format: json
          scan-ref: "."
          output: trivy-results.json
          severity: CRITICAL,HIGH
          skip-dirs: .cache/**,trivy
          skip-files: Manifest.toml,Project.toml

      - name: Run Trivy scan (Table format)
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          scan-type: fs
          scanners: vuln,misconfig
          ignore-unfixed: true
          format: table
          scan-ref: "."
          output: trivy-results.txt
          severity: CRITICAL,HIGH
          skip-dirs: .cache/**,trivy
          skip-files: Manifest.toml,Project.toml

      - name: Generate and post comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const processTrivy = require('./.github/scripts/trivy-comment.js');
            const result = await processTrivy({ github, context });

            console.log('📊 Scan Summary:');
            console.log(`   Total: ${result.vulnCount}`);
            console.log(`   Critical: ${result.criticalCount}`);
            console.log(`   High: ${result.highCount}`);

            // Set output cho các step sau
            core.setOutput('vuln_count', result.vulnCount);
            core.setOutput('critical_count', result.criticalCount);

      - name: Fail if critical vulnerabilities found
        if: always()
        run: |
          CRITICAL_COUNT=$(cat trivy-results.txt | grep -c "CRITICAL" || true)
          if [ $CRITICAL_COUNT -gt 0 ]; then
            echo "::error::❌ Found $CRITICAL_COUNT CRITICAL vulnerabilities!"
            exit 1
          fi
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
